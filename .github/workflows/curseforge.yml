name: CurseForge

on:
  # Called by the release workflow once the jars are attached to the release
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  # Uploads the jars of an existing release
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload, e.g. v1.1.0
        type: string
        required: true
      files:
        description: Only upload the jars matching this pattern, e.g. `*-neoforge-*` to finish an interrupted upload
        type: string
        default: "*"

permissions:
  contents: read

jobs:
  upload:
    name: Upload to CurseForge
    # Needs the repository variable CURSEFORGE_PROJECT_ID and the secret CURSEFORGE_TOKEN, repositories without a
    # CurseForge project skip the upload. CURSEFORGE_ENVIRONMENTS can limit the sides, e.g. to `Server`
    if: vars.CURSEFORGE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download jars
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ inputs.files || '*' }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$FILES.jar" --dir jars

      - name: Upload jars
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          ENVIRONMENTS: ${{ vars.CURSEFORGE_ENVIRONMENTS }}
          TAG: ${{ inputs.tag }}
        run: .github/scripts/curseforge-upload.sh jars
